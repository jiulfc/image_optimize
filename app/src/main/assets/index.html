<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #ccc;
        font-family: -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #img,
      #vid {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        display: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #img.active,
      #vid.active {
        display: block;
      }
      #img.show,
      #vid.show {
        opacity: 1;
      }
      #topbar {
        position: fixed;
        top: 10px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      #switch button {
        background: transparent;
        border: 1px solid #555;
        border-radius: 6px;
        color: #aaa;
        padding: 4px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      #switch button.active {
        border-color: #bbb;
        color: #fff;
      }
      #prog {
        padding: 4px 10px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
      }
      #date {
        padding: 4px 10px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
      }
      #empty {
        display: none;
        color: #666;
        font-size: 18px;
      }
      #confirm {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #confirm .box {
        background: #222;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px 40px 20px 40px;
        text-align: center;
        font-size: 16px;
      }
      #confirm .hint {
        color: #888;
        font-size: 13px;
        margin-top: 10px;
      }
      #confirm .btns {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 16px;
      }
      #confirm button {
        padding: 8px 18px;
        font-size: 14px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #333;
        color: #ddd;
        cursor: pointer;
      }
      #confirm button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <div id="view">
      <img id="img" alt="" /><video id="vid" controls autoplay></video>
      <div id="empty">no media</div>
    </div>
    <div id="topbar">
      <div id="switch">
        <button id="btnImg">Photos</button>
        <button id="btnVid">Videos</button>
      </div>
      <div id="prog"></div>
      <div id="date"></div>
    </div>
    <div id="confirm">
      <div class="box">
        <h3>Delete this media?</h3>
        <div class="btns">
          <button id="btnNo">Cancel (Esc)</button>
          <button id="btnYes">Confirm (Enter)</button>
        </div>
      </div>
    </div>
    <script>
      let TOTAL = __TOTAL__;
      const TYPE = "__TYPE__";
      const RW = __RW__;
      let DATES = __DATES__;
      let TOKEN = sessionStorage.getItem("token");
      if (!TOKEN) {
        TOKEN = new URLSearchParams(location.search).get("token") || "";
        if (TOKEN) sessionStorage.setItem("token", TOKEN);
      }
      let i = parseInt(new URLSearchParams(location.search).get("page")) || 0;
      i = Math.max(0, Math.min(i, TOTAL - 1));
      let confirmShown = false;
      const media = document.getElementById(TYPE === "video" ? "vid" : "img");
      const prog = document.getElementById("prog");
      const date = document.getElementById("date");
      const empty = document.getElementById("empty");
      const confirmBox = document.getElementById("confirm");

      document.title = TYPE === "video" ? "Videos" : "Photos";
      document
        .getElementById(TYPE === "video" ? "btnVid" : "btnImg")
        .classList.add("active");
      function go(type) {
        if (type === TYPE) return;
        location.href = "/" + type + "/one?page=" + i + "&token=" + TOKEN;
      }
      document.getElementById("btnImg").addEventListener("click", function () {
        go("image");
      });
      document.getElementById("btnVid").addEventListener("click", function () {
        go("video");
      });

      function render() {
        if (TOTAL === 0) {
          empty.style.display = "block";
          media.style.display = "none";
          prog.textContent = "";
          date.textContent = "";
          return;
        }
        empty.style.display = "none";
        prog.textContent = i + 1 + " / " + TOTAL;
        date.textContent = DATES[i]
          ? new Date(DATES[i] * 1000).toLocaleString()
          : "";
        history.replaceState(null, "", "?page=" + i + "&token=" + TOKEN);
        media.classList.add("active");
        media.classList.remove("show");
        setTimeout(function () {
          media.src =
            "/" +
            TYPE +
            "/media?i=" +
            i +
            "&t=" +
            Date.now() +
            "&token=" +
            TOKEN;
        }, 250);
      }
      media.addEventListener(
        TYPE === "video" ? "canplay" : "load",
        function () {
          media.classList.add("show");
        },
      );
      media.addEventListener("error", function () {
        ensureSession();
      });

      async function ensureSession() {
        try {
          const j = await (await fetch("/auth")).json();
          if (!j.token) {
            location.href = "/" + TYPE + "/one";
            return false;
          }
          return true;
        } catch (e) {
          return true;
        }
      }

      function confirmOn() {
        confirmShown = true;
        confirmBox.style.display = "flex";
      }
      function confirmOff() {
        confirmShown = false;
        confirmBox.style.display = "none";
      }

      document.getElementById("btnYes").addEventListener("click", doDelete);
      document.getElementById("btnNo").addEventListener("click", confirmOff);

      document.addEventListener("keydown", function (e) {
        if (confirmShown) {
          if (e.key === "Enter") doDelete();
          else if (e.key === "Escape") confirmOff();
          return;
        }
        if (e.key === "ArrowRight" && i < TOTAL - 1) {
          e.preventDefault();
          i++;
          render();
        } else if (e.key === "ArrowLeft" && i > 0) {
          e.preventDefault();
          i--;
          render();
        } else if (e.key === "Delete" || e.key === "Backspace") {
          e.preventDefault();
          if (!RW) {
            alert("read-only mode");
            return;
          }
          confirmOn();
        }
      });

      async function doDelete() {
        confirmOff();
        const r = await fetch("/" + TYPE + "/del?i=" + i + "&token=" + TOKEN, {
          method: "POST",
        });
        if (!r.ok) {
          const msg = (await r.text()).trim();
          if (await ensureSession()) alert(msg || "delete failed");
          return;
        }
        media.classList.remove("show");
        setTimeout(function () {
          DATES.splice(i, 1);
          TOTAL--;
          if (i >= TOTAL) i = TOTAL - 1;
          render();
        }, 250);
      }
      render();
    </script>
  </body>
</html>
